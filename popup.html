<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>ConversorDivisas</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app">

    <header class="header">
      <h1 class="header__title">ConversorDivisas</h1>
      <p class="header__rate" id="rate-line" aria-live="polite"></p>
    </header>

    <main class="converter">
      <form id="converter-form" novalidate>

        <div class="field">
          <label class="field__label" for="amount">Cantidad</label>
          <div class="field__caja">
            <input
              class="field__input"
              type="text"
              id="amount"
              name="amount"
              inputmode="decimal"
              autocomplete="off"
              spellcheck="false"
              value="1"
              title="También vale una cuenta: 20+15, 3*12,50, (40+60)/4, 100-15%"
              aria-describedby="amount-error">
            <span class="calculo" id="calculo" aria-hidden="true"></span>
          </div>
          <p class="field__error" id="amount-error" role="alert" hidden></p>
        </div>

        <div class="pair">
          <div class="field">
            <span class="field__label" id="from-label">De</span>
            <div class="buscador" id="from-caja">
              <button
                class="field__select buscador__boton"
                type="button"
                id="from"
                aria-haspopup="listbox"
                aria-expanded="false"
                aria-labelledby="from-label from"></button>
              <div class="buscador__panel" id="from-panel" hidden>
                <input
                  class="buscador__campo"
                  type="text"
                  id="from-filtro"
                  placeholder="Buscar divisa"
                  autocomplete="off"
                  spellcheck="false"
                  aria-label="Buscar divisa">
                <ul class="buscador__lista" id="from-lista" role="listbox"></ul>
              </div>
            </div>
          </div>

          <button
            class="swap"
            type="button"
            id="swap"
            aria-label="Intercambiar divisas">
            <span class="swap__icon" aria-hidden="true">⇄</span>
          </button>

          <div class="field">
            <span class="field__label" id="to-label">A</span>
            <div class="buscador" id="to-caja">
              <button
                class="field__select buscador__boton"
                type="button"
                id="to"
                aria-haspopup="listbox"
                aria-expanded="false"
                aria-labelledby="to-label to"></button>
              <div class="buscador__panel" id="to-panel" hidden>
                <input
                  class="buscador__campo"
                  type="text"
                  id="to-filtro"
                  placeholder="Buscar divisa"
                  autocomplete="off"
                  spellcheck="false"
                  aria-label="Buscar divisa">
                <ul class="buscador__lista" id="to-lista" role="listbox"></ul>
              </div>
            </div>
          </div>
        </div>

      </form>

      <div class="recientes" id="recientes" role="group" aria-label="Pares recientes" hidden></div>

      <section class="result" aria-labelledby="result-label">
        <div class="result__head">
          <h2 class="result__label" id="result-label">Resultado</h2>
          <button
            class="copiar"
            type="button"
            id="copiar"
            aria-label="Copiar el resultado">
            <span class="copiar__texto" id="copiar-texto">Copiar</span>
          </button>
        </div>
        <div class="result__row">
          <input
            class="result__value"
            type="text"
            id="result"
            inputmode="decimal"
            autocomplete="off"
            spellcheck="false"
            aria-label="Cantidad convertida"
            value="—">
          <span class="result__code" id="result-code" aria-hidden="true"></span>
        </div>
        <p class="result__meta" id="result-meta"></p>

        <div class="panel" id="panel">
          <div class="panel__head">
            <div class="vistas" id="vistas" role="tablist" aria-label="Qué ver debajo del resultado" data-vista="evolucion">
              <span class="vistas__pildora" aria-hidden="true"></span>
              <button
                class="vista is-activa"
                type="button"
                role="tab"
                id="vista-evolucion"
                data-vista="evolucion"
                aria-selected="true"
                aria-controls="trend"
                title="Evolución de la tasa">
                <svg viewBox="0 0 14 14" aria-hidden="true"><path d="M1 11l3.5-4 3 2L13 3"/></svg>
              </button>
              <button
                class="vista"
                type="button"
                role="tab"
                id="vista-extras"
                data-vista="extras"
                aria-selected="false"
                aria-controls="extras"
                tabindex="-1"
                title="Otras divisas">
                <svg viewBox="0 0 14 14" aria-hidden="true"><rect x="1.5" y="1.5" width="4.5" height="4.5" rx="1"/><rect x="8" y="1.5" width="4.5" height="4.5" rx="1"/><rect x="1.5" y="8" width="4.5" height="4.5" rx="1"/><rect x="8" y="8" width="4.5" height="4.5" rx="1"/></svg>
              </button>
            </div>
            <div class="trend__controles" id="trend-controles" hidden>
              <div class="rangos" role="group" aria-label="Periodo del gráfico">
                <button class="rango" type="button" data-dias="7">7D</button>
                <button class="rango" type="button" data-dias="30">30D</button>
                <button class="rango" type="button" data-dias="90">90D</button>
              </div>
              <span class="trend__change" id="trend-change"></span>
            </div>
          </div>

          <div class="trend" id="trend" role="tabpanel" aria-labelledby="vista-evolucion" hidden>
            <div
              class="trend__lienzo"
              id="trend-lienzo"
              tabindex="0"
              aria-label="Gráfico de la tasa. Con las flechas vas día a día.">
              <svg
                class="trend__chart"
                id="trend-chart"
                viewBox="0 0 100 28"
                preserveAspectRatio="none"
                role="img"
                aria-labelledby="trend-desc">
                <title id="trend-desc">Evolución de la tasa</title>
                <defs>
                  <linearGradient id="trend-fill" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="var(--brass)" stop-opacity="0.28"></stop>
                    <stop offset="100%" stop-color="var(--brass)" stop-opacity="0"></stop>
                  </linearGradient>
                </defs>
                <path class="trend__area" id="trend-area" d=""></path>
                <path class="trend__line" id="trend-line" d=""></path>
              </svg>
              <span class="trend__marca trend__marca--max" id="marca-max" aria-hidden="true"></span>
              <span class="trend__marca trend__marca--min" id="marca-min" aria-hidden="true"></span>
              <span class="trend__guia" id="trend-guia" aria-hidden="true"></span>
              <span class="trend__punto" id="trend-punto" aria-hidden="true"></span>
              <div class="trend__tip" id="trend-tip" role="status" aria-live="polite">
                <span class="trend__tip-fecha" id="tip-fecha"></span>
                <span class="trend__tip-valor" id="tip-valor"></span>
              </div>
            </div>
            <div class="trend__pie" id="trend-pie">
              <span class="trend__extremo trend__extremo--min" id="pie-min"></span>
              <span class="trend__extremo trend__extremo--max" id="pie-max"></span>
            </div>
          </div>

          <div class="extras" id="extras" role="tabpanel" aria-labelledby="vista-extras" hidden>
            <ul class="extras__rejilla" id="extras-rejilla"></ul>
            <div class="bandeja" id="bandeja" hidden>
              <div class="bandeja__opciones" id="bandeja-opciones" role="group" aria-label="Añadir divisa"></div>
              <button class="bandeja__cerrar" type="button" id="bandeja-cerrar" aria-label="Cerrar">✕</button>
            </div>
          </div>
        </div>
      </section>

      <div class="status" id="status" role="status" aria-live="polite" hidden></div>

      <div class="error" id="error" role="alert" hidden>
        <p class="error__message" id="error-message"></p>
        <button class="error__retry" type="button" id="retry">Reintentar</button>
      </div>

    </main>

    <footer class="footer">
      <p class="footer__source">
        Tasas de <a href="https://frankfurter.dev" target="_blank" rel="noopener noreferrer">Frankfurter</a>
      </p>
      <p class="footer__updated" id="updated"></p>
    </footer>

  </div>

  <script src="logica.js"></script>
  <script src="popup.js"></script>
</body>
</html>
