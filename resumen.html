<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ConversorDivisas · Tarjeta del viaje</title>
  <link rel="icon" href="icons/icon48.png">
  <link rel="stylesheet" href="copia.css">
  <link rel="stylesheet" href="resumen.css">
</head>
<body>
  <main class="pagina">
    <header class="cabeza">
      <img class="cabeza__logo" src="icons/icon128.png" alt="" width="44" height="44">
      <div>
        <p class="cabeza__app">ConversorDivisas</p>
        <h1 class="cabeza__titulo" id="titulo" data-t="resumen.titulo">Tarjeta del viaje</h1>
      </div>
    </header>
    <p class="intro" id="intro" data-t="resumen.intro">El viaje en una imagen, para mandarla al grupo o guardarla de recuerdo.</p>
    <nav class="anios" id="anios" aria-label="Años" hidden></nav>

    <section class="tarjeta" aria-labelledby="vista-titulo">
      <h2 class="tarjeta__titulo" id="vista-titulo" data-t="resumen.vista">Así queda</h2>
      <article class="postal" id="postal" aria-live="polite"></article>
      <p class="error" id="error" role="alert" hidden></p>
      <div class="vista-previa__botones">
        <button class="boton boton--dorado" type="button" id="descargar">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2v8M4.5 6.8L8 10.3l3.5-3.5M2.5 13.5h11"/></svg>
          <span id="descargar-texto" data-t="resumen.descargar">Descargar imagen</span>
        </button>
        <button class="boton" type="button" id="copiar">
          <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="5" y="5" width="8.5" height="8.5" rx="1.5"/><path d="M11 5V3.5A1.5 1.5 0 0 0 9.5 2h-6A1.5 1.5 0 0 0 2 3.5v6A1.5 1.5 0 0 0 3.5 11H5"/></svg>
          <span id="copiar-texto" data-t="resumen.copiar">Copiar imagen</span>
        </button>
      </div>
    </section>

    <footer class="pie">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.8l5 2v4c0 3-2.2 5.3-5 6.4-2.8-1.1-5-3.4-5-6.4v-4z"/></svg>
      <span data-t="resumen.pie">La imagen se hace aquí, en tu navegador: no se sube a ningún sitio.</span>
    </footer>
  </main>

  <script src="textos.js"></script>
  <script src="logica.js"></script>
  <script src="resumen.js"></script>
</body>
</html>
